import sys

from pathlib import Path

# do not rename
async def custom_site():
    import embed
    platform.document.body.style.background = "#7f7f7f"

    platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"


    bundle = "blue-lock-football"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/blue-lock-football
    appdir.mkdir()


    # unpack filesystem from compressed archive into work dir
    if platform.window.location.host.find('.itch.zone')>0:
        import zipfile
        async with platform.fopen("blue-lock-football.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("blue-lock-football.tar.gz", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # TODO: test for window.webkitAudioContext and block aio loop until gesture if accessing media manager play
    # before a gesture is recorded ( touch or click )

    # test/wait user media interaction
    if not platform.window.MM.UME:

        # now that apk is mounted we have access to font cache
        # but we need to fill __file__ that is not yet set
        __import__(__name__).__file__ = main

        # now make a prompt
        msg  = "Ready to start ! Please click/touch page"
        platform.window.infobox.innerText = msg
        print("\n"*4, f"    * Waiting for media user engagement. {msg} *" , "\n"*4)

        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    # start async top level machinery if not started and add a console in any case if requested.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache
    # but we need to fill __file__/__name__ that are not yet set
    __import__(__name__).__file__ = main


    def ui_callback(pkg):
        platform.window.infobox.innerText = f"installing {pkg}"

    await shell.source(main, callback=ui_callback)

    # if you don't reach that step
    # your main.py has an infinite sync loop somewhere !

    platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    print("default.tmpl: done")

    shell.interactive()

    <script type="application/javascript">
    // ═══════════════════════════════════════════════════════════════
    //  MOBILE GAMEPAD & FULLSCREEN CONTROLLER
    // ═══════════════════════════════════════════════════════════════

    // Fullscreen API toggle
    function toggleFullscreen() {
        const doc = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement && !document.msFullscreenElement) {
            if (doc.requestFullscreen) { doc.requestFullscreen(); }
            else if (doc.webkitRequestFullscreen) { doc.webkitRequestFullscreen(); }
            else if (doc.mozRequestFullScreen) { doc.mozRequestFullScreen(); }
            else if (doc.msRequestFullscreen) { doc.msRequestFullscreen(); }
        } else {
            if (document.exitFullscreen) { document.exitFullscreen(); }
            else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
            else if (document.mozCancelFullScreen) { document.mozCancelFullScreen(); }
            else if (document.msExitFullscreen) { document.msExitFullscreen(); }
        }
    }

    const heldKeys = new Set();

    function fireKey(code, key, down) {
        const type = down ? 'keydown' : 'keyup';
        if (down && heldKeys.has(code)) return;
        if (!down && !heldKeys.has(code)) return;

        if (down) heldKeys.add(code); else heldKeys.delete(code);

        const canvas = document.getElementById('canvas');
        const target = canvas || document.body;

        const evt = new KeyboardEvent(type, {
            bubbles: true, cancelable: true,
            key: key, code: code,
            keyCode: 0, which: 0
        });
        target.dispatchEvent(evt);
    }

    // Joystick
    const joystickZone = document.getElementById('joystick-zone');
    const joystickBase = document.getElementById('joystick-base');
    const joystickKnob = document.getElementById('joystick-knob');

    const JOYSTICK_RADIUS = 65;
    const KNOB_DEADZONE   = 16;
    let joystickActive = false;
    let joystickOriginX = 0, joystickOriginY = 0;
    let joystickTouchId = null;

    function joystickStart(clientX, clientY, touchId) {
        joystickActive = true;
        joystickTouchId = touchId;
        const rect = joystickBase.getBoundingClientRect();
        joystickOriginX = rect.left + JOYSTICK_RADIUS;
        joystickOriginY = rect.top  + JOYSTICK_RADIUS;
        joystickMove(clientX, clientY);
    }

    function joystickMove(clientX, clientY) {
        if (!joystickActive) return;

        let dx = clientX - joystickOriginX;
        let dy = clientY - joystickOriginY;
        const dist = Math.hypot(dx, dy);

        if (dist > JOYSTICK_RADIUS) {
            dx = (dx / dist) * JOYSTICK_RADIUS;
            dy = (dy / dist) * JOYSTICK_RADIUS;
        }

        joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

        fireKey('KeyW', 'w', dy < -KNOB_DEADZONE);
        fireKey('KeyS', 's', dy >  KNOB_DEADZONE);
        fireKey('KeyA', 'a', dx < -KNOB_DEADZONE);
        fireKey('KeyD', 'd', dx >  KNOB_DEADZONE);
    }

    function joystickEnd() {
        if (!joystickActive) return;
        joystickActive = false;
        joystickTouchId = null;
        joystickKnob.style.transform = 'translate(-50%, -50%)';
        ['KeyW','KeyS','KeyA','KeyD'].forEach(c => fireKey(c, c.replace('Key','').toLowerCase(), false));
        fireKey('ShiftLeft', 'Shift', false);
    }

    if (joystickZone) {
        joystickZone.addEventListener('touchstart', e => {
            e.preventDefault();
            const t = e.changedTouches[0];
            joystickStart(t.clientX, t.clientY, t.identifier);
        }, { passive: false });

        joystickZone.addEventListener('touchmove', e => {
            e.preventDefault();
            for (const t of e.changedTouches) {
                if (t.identifier === joystickTouchId) {
                    joystickMove(t.clientX, t.clientY);
                }
            }
        }, { passive: false });

        joystickZone.addEventListener('touchend', e => { e.preventDefault(); joystickEnd(); }, { passive: false });
        joystickZone.addEventListener('touchcancel', e => { e.preventDefault(); joystickEnd(); }, { passive: false });
    }

    // Action Buttons
    function bindButton(id, keyCode, keyChar) {
        const btn = document.getElementById(id);
        if (!btn) return;

        btn.addEventListener('touchstart', e => {
            e.preventDefault();
            e.stopPropagation();
            btn.style.opacity = '0.65';
            btn.style.transform = 'scale(0.92)';
            fireKey(keyCode, keyChar, true);
        }, { passive: false });

        btn.addEventListener('touchend', e => {
            e.preventDefault();
            e.stopPropagation();
            btn.style.opacity = '1';
            btn.style.transform = 'scale(1)';
            fireKey(keyCode, keyChar, false);
        }, { passive: false });

        btn.addEventListener('touchcancel', e => {
            btn.style.opacity = '1';
            btn.style.transform = 'scale(1)';
            fireKey(keyCode, keyChar, false);
        }, { passive: false });
    }

    bindButton('btn-sprint', 'ShiftLeft', 'Shift');
    bindButton('btn-pass', 'KeyF', 'f');
    bindButton('btn-shoot', 'KeyG', 'g');
    bindButton('btn-start', 'Enter', 'Enter');

    const btnMenu = document.getElementById('btn-menu');
    if (btnMenu) {
        btnMenu.addEventListener('touchstart', e => {
            e.preventDefault();
            fireKey('Escape', 'Escape', true);
            setTimeout(() => fireKey('Escape', 'Escape', false), 80);
        }, { passive: false });
    }

    // Prevent default touch scrolls & enable full touch experience
    document.addEventListener('touchmove', e => {
        if (e.target.closest('#gamepad') || e.target.closest('canvas')) {
            e.preventDefault();
        }
    }, { passive: false });

    console.log('[Mobile UI] Gamepad, Fullscreen, and Touch menu controller initialized ✅');
    </script>
