import sys
import asyncio
import platform
import json
from pathlib import Path

# do not rename
async def custom_site():
    import embed
    platform.document.body.style.background = "#7f7f7f"

    platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"


    bundle = "blue-lock-football"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/blue-lock-football
    appdir.mkdir()


    # unpack filesystem from compressed archive into work dir
    if platform.window.location.host.find('.itch.zone')>0:
        import zipfile
        async with platform.fopen("blue-lock-football.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("blue-lock-football.tar.gz", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # TODO: test for window.webkitAudioContext and block aio loop until gesture if accessing media manager play
    # before a gesture is recorded ( touch or click )

    # Force user media engagement to True so game starts immediately on mobile
    platform.window.MM.UME = True

    # start async top level machinery if not started and add a console in any case if requested.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache
    # but we need to fill __file__/__name__ that are not yet set
    __import__(__name__).__file__ = main


    def ui_callback(pkg):
        platform.window.infobox.innerText = f"installing {pkg}"

    await shell.source(main, callback=ui_callback)

    # if you don't reach that step
    # your main.py has an infinite sync loop somewhere !

    platform.window.infobox.style.display = "none"
    platform.window.pyconsole.style.display = "none"
    platform.window.config.gui_divider = 0
    platform.window.window_resize()
    print("default.tmpl: done")

    shell.interactive()

asyncio.run( custom_site() )

    <script type="application/javascript">
    // ═══════════════════════════════════════════════════════════════
    //  MOBILE CONTROLLER & EMSCRIPTEN KEYBOARD EVENT DISPATCHER
    // ═══════════════════════════════════════════════════════════════

    // Force user media engagement to true on page touch
    window.addEventListener('pointerdown', () => {
        if (window.MM) window.MM.UME = true;
        const box = document.getElementById('infobox');
        if (box) box.style.display = 'none';
    }, { passive: true });

    window.addEventListener('touchstart', () => {
        if (window.MM) window.MM.UME = true;
        const box = document.getElementById('infobox');
        if (box) box.style.display = 'none';
    }, { passive: true });

    function toggleFullscreen() {
        const doc = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement && !document.msFullscreenElement) {
            if (doc.requestFullscreen) { doc.requestFullscreen(); }
            else if (doc.webkitRequestFullscreen) { doc.webkitRequestFullscreen(); }
            else if (doc.mozRequestFullScreen) { doc.mozRequestFullScreen(); }
            else if (doc.msRequestFullscreen) { doc.msRequestFullscreen(); }
        } else {
            if (document.exitFullscreen) { document.exitFullscreen(); }
            else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
            else if (document.mozCancelFullScreen) { document.mozCancelFullScreen(); }
            else if (document.msExitFullscreen) { document.msExitFullscreen(); }
        }
    }

    const heldKeys = new Set();

    function fireKey(code, key, down) {
        const type = down ? 'keydown' : 'keyup';
        if (down && heldKeys.has(code)) return;
        if (!down && !heldKeys.has(code)) return;

        if (down) heldKeys.add(code); else heldKeys.delete(code);

        // Map key codes for Emscripten SDL2
        let keyCodeVal = 0;
        if (code === 'KeyW' || code === 'ArrowUp') keyCodeVal = 87; // W / UP
        else if (code === 'KeyS' || code === 'ArrowDown') keyCodeVal = 83; // S / DOWN
        else if (code === 'KeyA' || code === 'ArrowLeft') keyCodeVal = 65; // A / LEFT
        else if (code === 'KeyD' || code === 'ArrowRight') keyCodeVal = 68; // D / RIGHT
        else if (code === 'Enter') keyCodeVal = 13;
        else if (code === 'Escape') keyCodeVal = 27;
        else if (code === 'KeyF') keyCodeVal = 70;
        else if (code === 'KeyG') keyCodeVal = 71;
        else if (code === 'ShiftLeft') keyCodeVal = 16;

        const opts = {
            bubbles: true,
            cancelable: true,
            view: window,
            key: key,
            code: code,
            keyCode: keyCodeVal,
            which: keyCodeVal,
            charCode: keyCodeVal
        };

        const evt1 = new KeyboardEvent(type, opts);
        window.dispatchEvent(evt1);
        const evt2 = new KeyboardEvent(type, opts);
        document.dispatchEvent(evt2);

        const canvas = document.getElementById('canvas');
        if (canvas) {
            const evt3 = new KeyboardEvent(type, opts);
            canvas.dispatchEvent(evt3);
        }
    }

    // Bind touch button
    function bindTouchBtn(elementId, code, keyName, isHoldable) {
        const el = document.getElementById(elementId);
        if (!el) return;

        const startHandler = (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (window.MM) window.MM.UME = true;
            fireKey(code, keyName, true);
            if (!isHoldable) {
                setTimeout(() => fireKey(code, keyName, false), 120);
            }
        };

        const endHandler = (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (isHoldable) {
                fireKey(code, keyName, false);
            }
        };

        el.addEventListener('touchstart', startHandler, { passive: false });
        el.addEventListener('touchend', endHandler, { passive: false });
        el.addEventListener('touchcancel', endHandler, { passive: false });
        el.addEventListener('mousedown', startHandler);
        el.addEventListener('mouseup', endHandler);
    }

    // D-Pad Bindings
    bindTouchBtn('dpad-up',    'KeyW', 'w', true);
    bindTouchBtn('dpad-down',  'KeyS', 's', true);
    bindTouchBtn('dpad-left',  'KeyA', 'a', true);
    bindTouchBtn('dpad-right', 'KeyD', 'd', true);

    // Action & Option Bindings
    bindTouchBtn('btn-select', 'Enter', 'Enter', false);
    bindTouchBtn('btn-change', 'KeyD',  'd',     false);
    bindTouchBtn('btn-sprint', 'ShiftLeft', 'Shift', true);
    bindTouchBtn('btn-pass',   'KeyF',  'f',     false);
    bindTouchBtn('btn-shoot',  'KeyG',  'g',     true);
    bindTouchBtn('btn-esc',    'Escape','Escape',false);

    // Analog Joystick Controller
    const joystickBase = document.getElementById('joystick-base');
    const joystickKnob = document.getElementById('joystick-knob');
    const JOYSTICK_RADIUS = 70;
    const DEADZONE = 18;
    let joystickActive = false;
    let touchId = null;
    let originX = 0, originY = 0;

    if (joystickBase) {
        joystickBase.addEventListener('touchstart', e => {
            e.preventDefault();
            if (window.MM) window.MM.UME = true;
            const t = e.changedTouches[0];
            joystickActive = true;
            touchId = t.identifier;
            const rect = joystickBase.getBoundingClientRect();
            originX = rect.left + JOYSTICK_RADIUS;
            originY = rect.top + JOYSTICK_RADIUS;
            updateJoystick(t.clientX, t.clientY);
        }, { passive: false });

        window.addEventListener('touchmove', e => {
            if (!joystickActive) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.identifier === touchId) {
                    updateJoystick(t.clientX, t.clientY);
                    break;
                }
            }
        }, { passive: false });

        const endJoystick = e => {
            if (!joystickActive) return;
            joystickActive = false;
            touchId = null;
            if (joystickKnob) joystickKnob.style.transform = 'translate(-50%, -50%)';
            fireKey('KeyW', 'w', false);
            fireKey('KeyS', 's', false);
            fireKey('KeyA', 'a', false);
            fireKey('KeyD', 'd', false);
        };

        window.addEventListener('touchend', endJoystick, { passive: false });
        window.addEventListener('touchcancel', endJoystick, { passive: false });
    }

    function updateJoystick(cx, cy) {
        let dx = cx - originX;
        let dy = cy - originY;
        const dist = Math.hypot(dx, dy);

        if (dist > JOYSTICK_RADIUS) {
            dx = (dx / dist) * JOYSTICK_RADIUS;
            dy = (dy / dist) * JOYSTICK_RADIUS;
        }

        if (joystickKnob) {
            joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        }

        fireKey('KeyW', 'w', dy < -DEADZONE);
        fireKey('KeyS', 's', dy >  DEADZONE);
        fireKey('KeyA', 'a', dx < -DEADZONE);
        fireKey('KeyD', 'd', dx >  DEADZONE);
    }

    // Auto-request fullscreen on first canvas tap on mobile
    const canvasEl = document.getElementById('canvas');
    if (canvasEl) {
        canvasEl.addEventListener('touchstart', () => {
            if (window.MM) window.MM.UME = true;
            if (window.innerWidth < 900 && !document.fullscreenElement) {
                toggleFullscreen();
            }
        }, { once: true, passive: true });
    }

    console.log('[Mobile Gamepad] Fully initialized ✅');
    </script>
